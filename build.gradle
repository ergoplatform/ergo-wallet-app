// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = "1.9.25"
    ext.robovm_version = "2.3.19"
    ext.sqldelight_version = "1.5.5"
    ext.coroutines_version = "1.8.1"
    ext.mosaik_version = "2.0.2"
    ext.compose_version = "1.5.15"
    ext.mockito_version = "4.0.0"
    ext.junit_version = "4.13.2"
    ext.nav_version = "2.8.5"
    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath("androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version")
        classpath "com.squareup.sqldelight:gradle-plugin:$sqldelight_version"
        classpath("com.guardsquare:proguard-gradle:7.2.1")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    
    // Configure Java toolchain to use Java 17 for compilation when running on newer Java
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

task convertStrings {
    dependsOn clean
    dependsOn ':android:assembleDebug'
}