buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "com.mobidevelop.robovm:robovm-gradle-plugin:$robovm_version"
    }
}

plugins {
    id 'java'
    id 'kotlin'
}

apply plugin: "robovm"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    bootCompat {
        java.srcDirs = ['src/bootCompat/java']
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += '-opt-in=kotlin.RequiresOptIn'
    }
}

task convertStrings {
    def source = '../android/build/intermediates/incremental/ergomainnetDebug/mergeErgomainnetDebugResources/merged.dir/values{l}/values{l}.xml'
    def dest = 'resources/i18n/strings{l}.properties'
    def dest2 = '../common-jvm/src/main/java/org/ergoplatform/uilogic/StringResources.kt'

    ext.changePlaceHolders = { stringText ->
        return stringText.replace("%1\$d", "{0}").replace("%1\$s", "{0}")
                .replace("%2\$d", "{1}").replace("%2\$s", "{1}")
                .replace("%3\$d", "{2}").replace("%3\$s", "{2}")
                .replace("%4\$d", "{3}").replace("%4\$s", "{3}")
    }

    ext.addEndLineChar = { line ->
        if (!line.endsWith("\\n"))
            return line + " \\"
        else
            return line + "\\"
    }

    ext.convertFile = { language ->
        def primaryLanguage = language == ""

        def output = project.file(dest.replace("{l}", primaryLanguage ? "" : "_" + language))
        def output2 = project.file(dest2)
        def input = project.file(source.replace("{l}", primaryLanguage ? "" : "-" + language.replace("_", "-r")))

        try {
            if (!output.parentFile.exists())
                output.parentFile.mkdirs()

            if (!output2.parentFile.exists())
                output2.parentFile.mkdirs()

            if (!input.exists())
                logger.error("Android merged values file not found. Please run gradlew clean convertStrings")

            def endTag = "</string>"

            def lines = input.text.readLines()
            def strings = new ArrayList<String>()
            def names = new ArrayList<String>()
            names.add("package org.ergoplatform.uilogic")
            names.add("// Auto-generated by gradlew ios:convertStrings")
            def isInString = false

            for (line in lines) {
                line = line.trim()
                if (isInString) {
                    def value
                    if (line.indexOf(endTag) >= 0) {
                        value = line.substring(0, line.indexOf(endTag))
                        isInString = false
                    } else
                        value = addEndLineChar(line)

                    strings.add(changePlaceHolders(value))
                } else if (line.startsWith("<string name=")) {
                    def name = line.substring(14)
                    name = name.substring(0, name.indexOf('"'))

                    if (line.indexOf("/>") < 0) {
                        def value = line.substring(line.indexOf('>') + 1)
                        if (value.indexOf(endTag) >= 0) {
                            value = value.substring(0, value.indexOf(endTag))
                        } else {
                            value = addEndLineChar(value)
                            isInString = true
                        }
                        strings.add(name + "=" + changePlaceHolders(value))
                        names.add("const val STRING_" + name.toUpperCase() + " = \"" + name + "\"")
                    }
                }
            }

            output.write(strings.join('\n'))
            if (primaryLanguage) output2.write(names.join('\n'))
            logger.info("Updated strings")
        } catch (ex) {
            throw new GradleException('Exception writing strings file', ex)
        }
    }

    doFirst {
        convertFile("")
        convertFile("zh")
        convertFile("es")
        convertFile("pt")
        convertFile("pt_PT")
        convertFile("it")
        convertFile("tr")
        convertFile("ru")
        convertFile("in")
    }
}

dependencies {
    implementation(project(path: ':common-jvm')){
        // normal compile no change iOS: 90 sec
        // exclude kiama, sigma-state, ergo-wallet: 20 sec
        // exclude group: 'org.scorexfoundation', module: 'sigma-state_2.12'
        //exclude group: 'org.ergoplatform', module: 'ergo-wallet_2.12'
    }

    implementation project(path: ':sqldelight')

    implementation "com.squareup.sqldelight:sqlite-driver:$sqldelight_version"
    implementation "com.mobidevelop.robovm:robovm-rt:${robovm_version}"
    implementation "com.mobidevelop.robovm:robovm-cocoatouch:${robovm_version}"

    // Mosaik
    implementation "com.github.MrStahlfelge.mosaik:common-abstractui:$mosaik_version"
    implementation "org.jetbrains:markdown-jvm:0.3.1"

    bootCompatCompileOnly "com.mobidevelop.robovm:robovm-rt:${robovm_version}"
}

tasks.named("classes") {
    dependsOn("bootCompatClasses")
}

tasks.withType(org.robovm.gradle.tasks.AbstractRoboVMTask).configureEach {
    dependsOn("bootCompatClasses", configurations.runtimeClasspath)
}

class RoboVmSmokeTestTask extends org.robovm.gradle.tasks.AbstractRoboVMTask {
    @Override
    protected org.robovm.compiler.config.Config.Builder configure(org.robovm.compiler.config.Config.Builder builder) {
        super.configure(builder)
        project.sourceSets.test.output.classesDirs.files.each { dir ->
            if (dir.exists()) {
                builder.addClasspathEntry(dir)
            }
        }
        def testRes = project.sourceSets.test.output.resourcesDir
        if (testRes != null && testRes.exists()) {
            builder.addClasspathEntry(testRes)
        }
        // Console smoke test uses no Swift libraries; disabling Swift library discovery
        // avoids MobiVM 3.0.0 Executor.execCapture() racing xcode-select stdout on macOS.
        builder.read(
                new StringReader("<config><swiftSupport><enable>false</enable></swiftSupport></config>"),
                project.projectDir
        )
        builder.mainClass("org.ergoplatform.ios.IosMobiVmSmokeTest")
        return builder
    }

    @org.gradle.api.tasks.TaskAction
    @Override
    void invoke() {
        def arch = org.robovm.compiler.config.Arch.getDefaultArch()
        if (extension.arch != null) {
            arch = org.robovm.compiler.config.Arch.parse(extension.arch)
        }
        def smokeInstallDir = new File(project.buildDir, "robovm-smoke")
        def builder = configure(new org.robovm.compiler.config.Config.Builder())
                .os(org.robovm.compiler.config.OS.getDefaultOS())
                .arch(arch)
                .targetType("console")
                .skipInstall(false)
                .installDir(smokeInstallDir)
        def config = builder.build()
        def compiler = new org.robovm.compiler.AppCompiler(config)
        compiler.build()
        compiler.install()

        def executable = new File(smokeInstallDir, config.executableName)
        def proc = new ProcessBuilder(executable.absolutePath)
                .directory(smokeInstallDir)
                .redirectErrorStream(true)
                .start()
        def outputPump = Thread.startDaemon("robovm-smoke-stdout") {
            proc.inputStream.eachLine("UTF-8") { line ->
                logger.lifecycle(line)
            }
        }
        boolean finished = proc.waitFor(180, java.util.concurrent.TimeUnit.SECONDS)
        if (!finished) {
            proc.destroyForcibly()
            throw new GradleException("MobiVM native smoke test timed out after 180 seconds")
        }
        outputPump.join(5000)
        int exitCode = proc.exitValue()
        if (exitCode != 0) {
            throw new GradleException("MobiVM native smoke test failed with exit code " + exitCode)
        }
    }
}

tasks.register("robovmSmokeTest", RoboVmSmokeTestTask) {
    description = "Compiles and executes the headless MobiVM native runtime smoke test"
    dependsOn("build", "testClasses", configurations.runtimeClasspath, configurations.testRuntimeClasspath)
}
