desc_display_mnemonic=Anda boleh memaparkan mnemonik anda (frasa benih, kunci kertas) sekiranya anda kehilangan sandaran anda, atau untuk mengesahkan bahawa sandaran anda adalah betul.
desc_display_xpubkey=Anda boleh menambah dompet ini sebagai dompet baca sahaja pada aplikasi dompet lain menggunakan kunci awam lanjutan anda. Tiada maklumat rahsia akan dikongsi.
desc_download_content=Ergo Wallet boleh memaparkan pratonton kandungan yang dipautkan ke token NFT. \
Sila ambil perhatian bahawa kandungan ini dicipta oleh pihak ketiga dan mungkin mengandungi perkara yang tidak diingini.
