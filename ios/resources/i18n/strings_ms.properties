desc_mosaik=Anda boleh menggunakan dan menambah dApps yang menyokong penyepaduan dompet di sini. \
Aplikasi terpencar (dApps) ialah palam masuk pihak ketiga yang menghubungkan dompet anda ke kontrak \
pintar. Mereka mungkin mengumpul maklumat yang anda berikan pada skrin mereka. Sebelum menambah dApp, \
sila sahkan URL aplikasi tersebut, dan semak syarat penggunaan serta dasar privasinya. dApps tidak \
berafiliasi dengan Ergo Wallet. Gunakan atas budi bicara anda sendiri.
