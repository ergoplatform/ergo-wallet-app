desc_copy_sensitive_data=Sila ambil perhatian bahawa dengan menyalin data ke papan \
keratan peranti, setiap aplikasi yang berjalan pada peranti ini boleh mengaksesnya selagi anda tidak menulis \
ganti data papan keratan tersebut. Anda melakukan ini atas risiko sendiri.
