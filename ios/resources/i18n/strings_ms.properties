desc_about=Disediakan kepada anda oleh Benjamin Schulte, {0}
desc_about_moreinfo=Dilesenkan di bawah <a href="https://github.com/ergoplatform/ergo-wallet-app/blob/master/LICENSE">Lesen Apache 2</a>\n\
Projek ini merupakan <a href="https://github.com/ergoplatform/ergo-wallet-app">perisian sumber terbuka</a>\n\
Dapatkan bantuan di <a href="https://discord.gg/kj7s7nb">Discord</a> atau <a href="https://t.me/ErgoWalletApp">Telegram</a>
desc_app_lock=Memerlukan pengesahan biometrik apabila membuka aplikasi dan selepas beberapa ketika tidak aktif.\n\n\
Hanya tersedia apabila pengesahan biometrik telah disediakan untuk peranti ini. Rahsia anda sentiasa disimpan dengan selamat, walaupun tanpa mengaktifkan pilihan ini.\n\
Melindungi daripada pandangan yang tidak diingini oleh orang lain yang menggunakan peranti ini. Kami amat mengesyorkan anda menggunakan skrin kunci peranti sebagai ganti.
