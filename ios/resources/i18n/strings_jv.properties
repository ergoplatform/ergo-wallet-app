desc_about_moreinfo=Dilisensikan ing ngisor <a href="https://github.com/ergoplatform/ergo-wallet-app/blob/master/LICENSE">Lisensi Apache 2</a>\n\
Proyek iki minangka <a href="https://github.com/ergoplatform/ergo-wallet-app">perangkat lunak sumber terbuka</a>\n\
Nemokake pitulung ing <a href="https://discord.gg/kj7s7nb">Discord</a> utawa <a href="https://t.me/ErgoWalletApp">Telegram</a>
desc_app_lock=Mbutuhake otentikasi biometrik nalika mbukak aplikasi lan sawise sawetara wektu ora aktif.\n\n\
Mung kasedhiya yen otentikasi biometrik wis disiapake kanggo piranti iki. Rahasia sampeyan mesthi disimpen kanthi aman, sanajan tanpa ngaktifake pilihan iki.\n\
Ngrangkep saka tampilan sing ora dikarepake saka wong liya sing nggunakake piranti iki. Disaranake banget nggunakake layar kunci piranti minangka gantine.
