kontrak. Dheweke bisa ngumpulake informasi sing sampeyan lebokake ing layar. Sadurunge nambah dApp, \
mangga konfirmasi URL aplikasi, lan deleng syarat panggunaan lan kabijakan privasi. dApps ora \
binaan karo Dompet Ergo. Gunakake miturut kawicaksanan panjenengan.
