desc_mosaik=Aquí puede usar y añadir dApps compatibles con la integración de la billetera. Las aplicaciones descentralizadas (dApps) son complementos de terceros que conectan su billetera con contratos inteligentes. Pueden recopilar la información que introduzca en sus pantallas. Antes de añadir una dApp, confirme la URL de la aplicación y revise sus condiciones de uso y sus políticas de privacidad. Las dApps no están afiliadas a Ergo Wallet. Úselas a su criterio.
