desc_app_lock=Exige autenticación biométrica al abrir la aplicación y tras un tiempo de inactividad.\n\nSolo está disponible si la autenticación biométrica está configurada en este dispositivo. Sus claves siempre se guardan de forma segura, aunque no active esta opción.\nProtege de las miradas indiscretas de otras personas que usen este dispositivo. Le recomendamos encarecidamente que, en su lugar, use el bloqueo de pantalla del dispositivo.
