desc_about_moreinfo=Dilisensikan di bawah <a href="https://github.com/ergoplatform/ergo-wallet-app/blob/master/LICENSE">Lisensi Apache 2</a>\n\
Proyek ini adalah <a href="https://github.com/ergoplatform/ergo-wallet-app">perangkat lunak sumber terbuka</a>\n\
Temukan bantuan di <a href="https://discord.gg/kj7s7nb">Discord</a> atau <a href="https://t.me/ErgoWalletApp">Telegram</a>
desc_app_lock=Memerlukan autentikasi biometrik saat membuka aplikasi dan setelah beberapa saat tidak aktif.\n\n\
Hanya tersedia jika autentikasi biometrik disiapkan untuk perangkat ini. Rahasia Anda selalu tersimpan dengan aman, bahkan tanpa mengaktifkan opsi ini.\n\
Melindungi dari tampilan yang tidak diinginkan dari orang lain yang menggunakan perangkat ini. Kami sangat menyarankan menggunakan layar kunci perangkat sebagai gantinya.
