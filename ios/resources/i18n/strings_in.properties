desc_mosaik=Anda dapat menggunakan dan menambahkan dApps yang mendukung integrasi dompet di sini. \
Aplikasi terdesentralisasi (dApps) adalah plug-in pihak ketiga yang menghubungkan dompet Anda dengan smart \
kontrak. Mereka mungkin mengumpulkan informasi yang Anda berikan di layar mereka. Sebelum menambahkan dApp, \
harap konfirmasikan URL aplikasi, dan tinjau persyaratan penggunaan dan kebijakan privasinya. dApps tidak \
berafiliasi dengan Dompet Ergo. Gunakan sesuai kebijaksanaan Anda.
